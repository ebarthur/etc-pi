# workers/charge — Paystack checkout-status poller (replaces the old webhook receiver; see
# src/index.ts's module docstring for why). Runs on a Cron Trigger, not an HTTP route.
#
# Secrets (never put these here — set via `wrangler secret put <NAME>`,
# same "real values never committed" rule as the repo's .env):
#   PAYSTACK_SECRET_KEY   same value as core/.env's PAYSTACK_SECRET_KEY
#   ARKESEL_API_KEY       same value as core/.env's ARKESEL_API_KEY
#   TURSO_DATABASE_URL    e.g. libsql://<db-name>-<org>.turso.io
#   TURSO_AUTH_TOKEN      Turso auth token for that database
#
# Plain (non-secret) vars, set below:
#   ARKESEL_SENDER_ID     same value as core/.env's ARKESEL_SENDER_ID
#   TOLL_GATE_NAME        same value as core/.env's TOLL_GATE_NAME

name = "smart-toll-charge-webhook"
main = "src/index.ts"
compatibility_date = "2026-08-14"

[vars]
# Confirmed against this session's live test SMS (sender field in the actual Arkesel
# request/response), not just core/config.py's fallback default -- .env overrides it to this.
ARKESEL_SENDER_ID = "ETC Project"
TOLL_GATE_NAME = "the N1 Highway Toll Point"

[triggers]
crons = ["* * * * *"]
